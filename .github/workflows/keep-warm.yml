# Keeps the live API awake on Render's free plan, which puts a service to sleep
# after ~15 minutes without traffic (the next visitor then waits ~20-30 seconds).
# Pings the lightweight health check every 10 minutes. It does not touch the
# database, so it does not use up database compute hours.
#
# Not needed once the service is on a paid Render plan (which never sleeps):
# delete this file then. GitHub may delay scheduled runs by a few minutes.
name: Keep API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: |
          curl --silent --show-error --fail --max-time 90 \
            --output /dev/null \
            --write-out "health %{http_code} in %{time_total}s\n" \
            https://dolearnn-backend.onrender.com/api/health
